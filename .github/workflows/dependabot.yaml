name: auto-merge
on: ["pull_request_target"]
# Least privilege for the auto-merge job. pull_request_target is required so
# the workflow runs with write access to approve/merge Dependabot PRs.
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ahmadnassri/action-dependabot-auto-merge@45fc124d949b19b6b8bf6645b6c9d55f4f9ac61a # v2
        with:
          # Keep GH_TOKEN to avoid breaking auto-merge; prefer a fine-grained
          # PAT scoped to this repository with only the permissions the
          # action needs (contents + pull requests write) over a broad token.
          github-token: ${{ secrets.GH_TOKEN }}
          update_type: all
