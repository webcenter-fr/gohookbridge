name: Supply-chain audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Validate audit allowlist
        run: scripts/check-audit-allowlist.sh
      - name: npm audit (high)
        working-directory: web
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.1.0
        with:
          go-version: "^1.26.0"
          check-latest: true
      - name: Run gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.0 detect --no-banner -v

  go-supply-chain:
    name: Go supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.1.0
        with:
          go-version: "^1.26.0"
          check-latest: true
      # NOTE: scripts/check-go-mod.sh is provided but not wired in yet: the
      # goca dependency removal (F31 go.mod modernization) is deferred, so the
      # gate would fail on the current tree. Wire it once F31 lands.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@latest

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render chart
        run: helm template gohookbridge helm/gohookbridge > /tmp/rendered.yaml
      - name: kubeconform
        run: |
          go run github.com/yannh/kubeconform/cmd/kubeconform@latest \
            -strict -ignore-missing-schemas /tmp/rendered.yaml
