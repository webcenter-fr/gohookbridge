name: Build and Test
on: ["push", "pull_request"]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.20.0"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # gohookbridge/web embeds static/*, which is gitignored and therefore
      # absent on a fresh checkout. Build the web assets before linting so the
      # embed directive resolves.
      - name: Build web assets
        run: make web-build

      - uses: alexellis/setup-arkade@v3
      - uses: alexellis/arkade-get@master
        with:
          golangci-lint: latest
      - name: Lint Go Code
        run: |
          make lint-go

  web:
    name: Web (Typecheck + Test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: cd web && npm ci

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Test
        run: cd web && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.20.0"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: |
          make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.20.0"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Unit tests.
        run: |
          make test
