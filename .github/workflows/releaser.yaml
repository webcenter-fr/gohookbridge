name: Release

on:
  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write
  packages: write
  issues: write

env:
  DAGGER_VERSION: "0.21.8"

jobs:
  goreleaser:
    name: GoReleaser (binaries + release assets)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run GoReleaser via Dagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_PRIVATE_KEY: ${{ secrets.AUR_PRIVATE_KEY }}
        run: |
          ARGS="goreleaser --source . --version ${GITHUB_REF_NAME} --gh-token env:GITHUB_TOKEN"
          if [ -n "${AUR_PRIVATE_KEY}" ]; then
            ARGS="${ARGS} --aur-key env:AUR_PRIVATE_KEY"
          fi
          dagger call -m ./dagger/gohookbridge ${ARGS} export --path dist
      - name: Upload GoReleaser dist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-dist
          path: dist/
          if-no-files-found: error

  docker:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build, push and validate image via Dagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call -m ./dagger/gohookbridge ci \
            --source . \
            --version "${GITHUB_REF_NAME}" \
            --registry-username "${{ github.actor }}" \
            --registry-password env:GITHUB_TOKEN \
            --push-latest
        # Full pipeline: hadolint + image build + GHCR push (version/latest) +
        # ephemeral k3s validation (helm install + webhook/SSE smoke checks).

  helm-release:
    name: Publish Helm chart to GHCR
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Publish Helm chart via Dagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call -m ./dagger/gohookbridge publish-helm \
            --source . \
            --version "${GITHUB_REF_NAME}" \
            --registry-username "${{ github.actor }}" \
            --registry-password env:GITHUB_TOKEN

  release-notes:
    name: Update release notes
    runs-on: ubuntu-latest
    needs: goreleaser
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Update release notes
        # Optional enhancement: only runs when the GEMINI_API_KEY secret is
        # configured; a missing key must never fail a release.
        if: env.GEMINI_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/generate-release-notes.sh
