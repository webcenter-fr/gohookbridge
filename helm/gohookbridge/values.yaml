server:
  enabled: true
  replicas: 3                      # HA default
  image:
    repository: ghcr.io/webcenter-fr/gohookbridge
    tag: main
    pullPolicy: IfNotPresent
  # Bind address inside the container. The server defaults to localhost, which
  # is not reachable by kubelet probes or Services, so pods must bind 0.0.0.0.
  address: "0.0.0.0"
  port: 3333
  raftPort: 6001
  natsPort: 4222
  natsClusterPort: 6222
  natsClusterName: ""             # defaults to the release fullname; must be identical on all nodes
  publicURL: ""
  raftDir: /data/raft
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi
    storageClass: ""                # leave "" for default; k3s local-path
  bootstrap:
    enabled: true
    config: {}                      # bootstrap.yaml content (admin user + session secret), stored in a Secret
  ingress:
    enabled: false
    className: ""
    annotations: {}                 # e.g. cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts: []
    tls: []
  service:
    type: ClusterIP
    port: 3333
  probes:
    liveness:
      httpGet:
        path: /livez
        port: http
    readiness:
      httpGet:
        path: /health
        port: http

client:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/webcenter-fr/gohookbridge
    tag: main
    pullPolicy: IfNotPresent
  channelURL: ""
  targetURL: ""
  encryptionKeyFile: ""
  resources: {}

proxy:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/webcenter-fr/gohookbridge
    tag: main
    pullPolicy: IfNotPresent
  listenPort: 9090
  targetURL: ""
  publicKey: ""
  resources: {}

encryption:
  createSecret: false
  publicKey: ""
  privateKey: ""
  existingSecret: ""

serviceAccount:
  create: false
  name: ""

nameOverride: ""
fullnameOverride: ""
