{{- if .Values.client.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gohookbridge.fullname" . }}-client
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
        app.kubernetes.io/component: client
    spec:
      containers:
      - name: client
        image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag }}"
        imagePullPolicy: {{ .Values.client.image.pullPolicy }}
        args:
        - client
        - {{ .Values.client.channelURL | quote }}
        - {{ .Values.client.targetURL | quote }}
        {{- if .Values.client.encryptionKeyFile }}
        - --encryption-key-file
        - {{ .Values.client.encryptionKeyFile | quote }}
        {{- end }}
        {{- if .Values.encryption.createSecret }}
        volumeMounts:
        - name: encryption-key
          mountPath: /etc/gohookbridge
          readOnly: true
        {{- end }}
        {{- with .Values.client.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.encryption.createSecret }}
      volumes:
      - name: encryption-key
        secret:
          secretName: {{ include "gohookbridge.encryptionSecretName" . }}
      {{- end }}
{{- end }}