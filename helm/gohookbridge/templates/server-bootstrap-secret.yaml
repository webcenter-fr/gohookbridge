{{- if and .Values.server.enabled .Values.server.bootstrap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gohookbridge.fullname" . }}-bootstrap
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap.yaml: |
    {{- $bootstrap := deepCopy .Values.server.bootstrap.config -}}
    {{- $auth := dict "internal" (dict "enabled" .Values.server.auth.internal.enabled) -}}
    {{- if gt (len (.Values.server.auth.oidc.providers | default list)) 0 -}}
    {{- $_ := set $auth "oidc" (dict "providers" .Values.server.auth.oidc.providers) -}}
    {{- end -}}
    {{- $_ := set $bootstrap "auth" $auth -}}
    {{- toYaml $bootstrap | nindent 4 }}
{{- end }}
