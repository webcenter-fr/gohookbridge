{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "gohookbridge.fullname" . }}
      {{- end }}
      containers:
      - name: server
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        args:
        - server
        - --port
        - "{{ .Values.server.port }}"
        - --raft-dir
        - {{ .Values.server.raftDir | quote }}
        {{- if .Values.server.publicURL }}
        - --public-url
        - {{ .Values.server.publicURL | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.server.port }}
          protocol: TCP
        - name: raft
          containerPort: 6001
          protocol: TCP
        - name: nats
          containerPort: 4222
          protocol: TCP
        - name: nats-cluster
          containerPort: 6222
          protocol: TCP
        volumeMounts:
        - name: raft-data
          mountPath: /data/raft
        {{- with .Values.server.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: raft-data
        persistentVolumeClaim:
          claimName: {{ include "gohookbridge.fullname" . }}-server-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server-data
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
{{- end }}