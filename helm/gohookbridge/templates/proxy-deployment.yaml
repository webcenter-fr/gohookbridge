{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gohookbridge.fullname" . }}-proxy
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
        app.kubernetes.io/component: proxy
    spec:
      containers:
      - name: proxy
        image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
        imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
        args:
        - proxy
        - --listen
        - ":{{ .Values.proxy.listenPort }}"
        - --target
        - {{ .Values.proxy.targetURL | quote }}
        {{- if .Values.proxy.publicKey }}
        - --pubkey
        - {{ .Values.proxy.publicKey | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.proxy.listenPort }}
          protocol: TCP
        {{- if .Values.encryption.createSecret }}
        volumeMounts:
        - name: encryption-key
          mountPath: /etc/gohookbridge
          readOnly: true
        {{- end }}
        {{- with .Values.proxy.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.encryption.createSecret }}
      volumes:
      - name: encryption-key
        secret:
          secretName: {{ include "gohookbridge.encryptionSecretName" . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gohookbridge.fullname" . }}-proxy
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.proxy.listenPort }}
    targetPort: {{ .Values.proxy.listenPort }}
    protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
    app.kubernetes.io/component: proxy
{{- end }}