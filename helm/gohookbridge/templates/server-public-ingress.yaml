{{- if and .Values.server.enabled .Values.server.publicIngress.enabled }}
{{- $publicPort := include "gohookbridge.publicPort" . | int }}
{{- if le $publicPort 0 }}
{{- fail "server.publicIngress.enabled is true but server.publicPort is 0 (disabled); set server.publicPort > 0 so the public webhook listener is served before enabling the public Ingress" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server-public
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
  {{- with .Values.server.publicIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.server.publicIngress.className }}
  ingressClassName: {{ .Values.server.publicIngress.className }}
  {{- end }}
  {{- if .Values.server.publicIngress.tls }}
  tls:
    {{- toYaml .Values.server.publicIngress.tls | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.server.publicIngress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "gohookbridge.fullname" $ }}-server
            port:
              name: public
  {{- end }}
{{- end }}
