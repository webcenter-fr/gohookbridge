{{- if .Values.server.enabled }}
{{- include "gohookbridge.validateAuth" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  serviceName: {{ include "gohookbridge.fullname" . }}-server-headless
  replicas: {{ .Values.server.replicas }}
  podManagementPolicy: Parallel   # all pods start simultaneously for faster quorum
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gohookbridge.name" . }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "gohookbridge.fullname" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds | default 60 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
      - name: server
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if and (gt (int .Values.server.replicas) 1) .Values.server.nats.clusterAuth.username .Values.server.nats.clusterAuth.existingSecret }}
        - name: NATS_CLUSTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.server.nats.clusterAuth.existingSecret }}
              key: {{ .Values.server.nats.clusterAuth.passwordKey | default "password" }}
        {{- end }}
        args:
        - server
        - --address
        - {{ .Values.server.address | quote }}
        - --port
        - "{{ .Values.server.port }}"
        {{- if gt (include "gohookbridge.publicPort" . | int) 0 }}
        - --public-address
        - {{ .Values.server.publicAddress | quote }}
        - --public-port
        - "{{ include "gohookbridge.publicPort" . }}"
        {{- end }}
        - --public-url
        - {{ .Values.server.publicURL | quote }}
        - --raft-dir
        - {{ .Values.server.raftDir | quote }}
        - --raft-node-id
        - $(POD_NAME)
        # Bind on all interfaces; advertise the pod's stable DNS name. The
        # headless Service sets publishNotReadyAddresses so this name resolves
        # before the pod is Ready.
        - --raft-bind-addr
        - 0.0.0.0:{{ .Values.server.raftPort }}
        - --raft-advertise-addr
        - {{ include "gohookbridge.raftAdvertise" . | quote }}
        - --raft-replicas
        - "{{ .Values.server.replicas }}"
        - --raft-statefulset-name
        - {{ include "gohookbridge.fullname" . }}-server
        - --raft-headless-service
        - {{ include "gohookbridge.fullname" . }}-server-headless
        - --raft-namespace
        - $(POD_NAMESPACE)
        - --raft-cluster-domain
        - {{ .Values.server.raft.clusterDomain | default "cluster.local" | quote }}
        - --raft-leader-wait-timeout
        - {{ .Values.server.raft.leaderWaitTimeout | default "60s" | quote }}
        - --raft-performance-multiplier
        - {{ .Values.server.raft.performanceMultiplier | default 5.0 | printf "%.1f" | quote }}
        {{- if .Values.server.raft.tls.enabled }}
        - --raft-tls-enabled
        {{- if gt (int .Values.server.replicas) 1 }}
        # Multi-node: manual pre-provisioned per-pod certificates.
        - --raft-tls-ca-cert
        - /etc/gohookbridge/tls/ca.crt
        - --raft-tls-cert
        - /etc/gohookbridge/tls/tls.crt
        - --raft-tls-key
        - /etc/gohookbridge/tls/tls.key
        {{- end }}
        {{- end }}
        {{- if .Values.server.raft.recoveryMode }}
        - --raft-recovery-mode
        {{- end }}
        - --raft-peers
        - {{ include "gohookbridge.raftPeers" . | quote }}
        - --nats-port
        - "{{ .Values.server.natsPort }}"
        {{- if eq (int .Values.server.replicas) 1 }}
        - --nats-disable-cluster
        {{- else }}
        - --nats-cluster-port
        - "{{ .Values.server.natsClusterPort }}"
        - --nats-routes
        - {{ include "gohookbridge.natsRoutes" . | quote }}
        # Every node must advertise the same NATS cluster name, otherwise
        # route connections are rejected with "Cluster Name Conflict" and
        # webhook fan-out stays local to each pod.
        - --nats-cluster-name
        - {{ .Values.server.natsClusterName | default (include "gohookbridge.fullname" .) | quote }}
        {{- if .Values.server.raft.tls.enabled }}
        - --nats-cluster-tls-ca
        - /etc/gohookbridge/tls/ca.crt
        - --nats-cluster-tls-cert
        - /etc/gohookbridge/tls/tls.crt
        - --nats-cluster-tls-key
        - /etc/gohookbridge/tls/tls.key
        {{- end }}
        {{- if .Values.server.nats.clusterAuth.username }}
        - --nats-cluster-username
        - {{ .Values.server.nats.clusterAuth.username | quote }}
        - --nats-cluster-password
        - $(NATS_CLUSTER_PASSWORD)
        {{- end }}
        {{- end }}
        {{- if .Values.server.bootstrap.enabled }}
        - --bootstrap-config-file
        - /etc/gohookbridge/bootstrap.yaml
        {{- end }}
        {{- if .Values.encryption.kek.existingSecret }}
        - --at-rest-key-file
        - /etc/gohookbridge/kek/key.json
        {{- end }}
        {{- if and .Values.server.raft.tls.enabled (gt (int .Values.server.replicas) 1) }}
        # Multi-node: the internal listener serves HTTPS from the same per-pod
        # certificate so leader forwarding can authenticate with mTLS (F13).
        - --tls-cert
        - /etc/gohookbridge/tls/tls.crt
        - --tls-key
        - /etc/gohookbridge/tls/tls.key
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.server.port }}
          protocol: TCP
        {{- if gt (include "gohookbridge.publicPort" . | int) 0 }}
        - name: public
          containerPort: {{ include "gohookbridge.publicPort" . }}
          protocol: TCP
        {{- end }}
        - name: raft
          containerPort: {{ .Values.server.raftPort }}
          protocol: TCP
        - name: nats
          containerPort: {{ .Values.server.natsPort }}
          protocol: TCP
        - name: nats-cluster
          containerPort: {{ .Values.server.natsClusterPort }}
          protocol: TCP
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  kill -TERM 1
                  sleep 2
        {{- with .Values.server.probes }}
        startupProbe:
          httpGet:
            path: {{ .startup.httpGet.path }}
            port: {{ .startup.httpGet.port }}
          {{- if and $.Values.server.raft.tls.enabled (gt (int $.Values.server.replicas) 1) }}
          scheme: HTTPS
          {{- end }}
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: {{ .readiness.httpGet.path }}
            port: {{ .readiness.httpGet.port }}
          {{- if and $.Values.server.raft.tls.enabled (gt (int $.Values.server.replicas) 1) }}
          scheme: HTTPS
          {{- end }}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: {{ .liveness.httpGet.path }}
            port: {{ .liveness.httpGet.port }}
          {{- if and $.Values.server.raft.tls.enabled (gt (int $.Values.server.replicas) 1) }}
          scheme: HTTPS
          {{- end }}
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        {{- end }}
        volumeMounts:
        - name: raft-data
          mountPath: {{ .Values.server.raftDir }}
        - name: tmp
          mountPath: /tmp
        {{- if .Values.server.bootstrap.enabled }}
        - name: bootstrap
          mountPath: /etc/gohookbridge/bootstrap.yaml
          subPath: bootstrap.yaml
          readOnly: true
        {{- end }}
        {{- if and .Values.server.raft.tls.enabled (gt (int .Values.server.replicas) 1) }}
        # Per-pod certificate material from the shared node-set Secret: each
        # pod projects only its own <ordinal>.crt/.key plus the public CA.
        - name: server-tls
          mountPath: /etc/gohookbridge/tls/tls.crt
          subPathExpr: $(POD_NAME).crt
          readOnly: true
        - name: server-tls
          mountPath: /etc/gohookbridge/tls/tls.key
          subPathExpr: $(POD_NAME).key
          readOnly: true
        - name: server-tls
          mountPath: /etc/gohookbridge/tls/ca.crt
          subPath: ca.crt
          readOnly: true
        {{- end }}
        {{- if .Values.encryption.kek.existingSecret }}
        - name: kek
          mountPath: /etc/gohookbridge/kek
          readOnly: true
        {{- end }}
        {{- with .Values.server.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.server.bootstrap.enabled }}
      - name: bootstrap
        secret:
          secretName: {{ include "gohookbridge.fullname" . }}-bootstrap
      {{- end }}
      {{- if and .Values.server.raft.tls.enabled (gt (int .Values.server.replicas) 1) }}
      - name: server-tls
        secret:
          secretName: {{ include "gohookbridge.serverTLSNodesSecret" . }}
      {{- end }}
      {{- if .Values.encryption.kek.existingSecret }}
      - name: kek
        secret:
          secretName: {{ .Values.encryption.kek.existingSecret }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: raft-data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.server.storage.storageClass }}
      storageClassName: {{ .Values.server.storage.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.server.storage.size }}
{{- end }}
