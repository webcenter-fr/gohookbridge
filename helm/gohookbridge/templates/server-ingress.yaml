{{- if and .Values.server.enabled .Values.server.ingress.enabled }}
{{- $allowlist := .Values.server.ingress.allowlistSourceRange | default list }}
{{- if and .Values.server.ingress.private (not .Values.server.ingress.internalLoadBalancer) (eq (len $allowlist) 0) }}
{{- fail "server.ingress.private=true requires server.ingress.internalLoadBalancer=true or a non-empty server.ingress.allowlistSourceRange (fail-closed internal ingress)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server
  labels:
    {{- include "gohookbridge.labels" . | nindent 4 }}
  {{- if or .Values.server.ingress.annotations $allowlist }}
  annotations:
    {{- with .Values.server.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $allowlist }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," $allowlist | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.server.ingress.className }}
  ingressClassName: {{ .Values.server.ingress.className }}
  {{- end }}
  {{- if .Values.server.ingress.tls }}
  tls:
    {{- toYaml .Values.server.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.server.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "gohookbridge.fullname" $ }}-server
            port:
              number: {{ $.Values.server.service.port }}
  {{- end }}
{{- end }}
