{{- if and .Values.server.enabled .Values.serviceAccount.create .Values.server.raft.tls.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server
  labels: {{- include "gohookbridge.labels" . | nindent 4 }}
rules:
# create cannot be scoped by resourceNames (the name does not exist yet), so
# it is granted on the secrets collection. get is scoped to the raft CA Secret
# only, so a compromised server cannot read unrelated Secrets in the namespace.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ include "gohookbridge.raftCASecret" . }}"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gohookbridge.fullname" . }}-server
  labels: {{- include "gohookbridge.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "gohookbridge.fullname" . }}-server }
subjects:
- kind: ServiceAccount
  name: {{ include "gohookbridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
