global:
  server:
    max_body_size: 26214400
    behind_reverse_proxy: false
    cors_origin: "*"
    rate_limit_enabled: false
    rate_limit_requests: 100
    rate_limit_window_seconds: 60
    ban_enabled: true
    ban_max_unique_failures: 1
    ban_window_seconds: 300
    ban_duration_seconds: 3600
  defaults:
    webhook_secret: ""
    allowed_ips: []
    message_ttl_seconds: 0
channels:
  - id: itest-ban-channel
    description: Channel with a webhook secret; a failed signature attempt bans the client IP
    webhook_secret: "integration-test-secret"
